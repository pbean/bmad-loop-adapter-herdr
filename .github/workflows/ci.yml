name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (bmad-loop from git + dev deps)
        run: uv sync
      - name: Format check
        run: uv run black --check src tests
      # Stable-channel herdr (install.sh has no version pin). The backend now
      # REQUIRES server protocol 17 (herdr >= 0.7.5): it refuses anything below and
      # warns once above. The smoke step asserts the installed stable binary is
      # protocol 17, so a stable channel that ever regresses below 17 hard-fails
      # here with a clear message instead of as opaque live-suite errors — desired.
      # With the binary present the HAVE_HERDR-gated integration/E2E suites run here
      # for real.
      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: herdr smoke (require protocol 17)
        run: |
          herdr --version
          herdr status --json
          herdr api schema | grep -qx 'protocol: 17'
      - name: Tests (unit + live integration/E2E)
        run: uv run pytest -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (bmad-loop from git + dev deps)
        run: uv sync
      # Windows builds ship on herdr's preview channel only. The installer
      # PATHs only its own process + the user registry, which later steps
      # don't re-read — hence the explicit GITHUB_PATH append.
      - name: Install herdr (preview channel)
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA "Programs\Herdr\bin")
          herdr --version
      - name: Unit tests (required)
        run: uv run pytest -q --ignore=tests/test_integration.py --ignore=tests/test_e2e.py
      # Advisory until herdr's Windows beta proves stable headless under a CI
      # service session (the full live suite is VM-verified green, 2026-07-22;
      # this flag tracks CI-environment risk, not the backend). Flip to
      # required once it has a green streak.
      - name: Live tests (herdr beta — advisory)
        continue-on-error: true
        run: uv run pytest -q tests/test_integration.py tests/test_e2e.py
